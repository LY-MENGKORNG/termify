[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.86"
description = "A modern, keyboard-first Spotify client for the terminal >_"
readme = "README.md"
keywords = ["spotify", "tui", "terminal", "music", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
] }
open = "5.4.1"
ratatui = "0.30.0"
rspotify = { version = "0.16.1", default-features = false, features = [
  "client-reqwest",
  "reqwest-rustls-tls",
] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "net",
  "io-util",
  "signal",
] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
termify-core = { path = "crates/core" }

[profile.dev]
debug = "line-tables-only"
