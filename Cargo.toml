[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.86"
description = "A modern, keyboard-first Spotify client for the terminal >_"
readme = "README.md"
keywords = ["spotify", "tui", "terminal", "music", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]

[workspace.dependencies]
termify-core = { path = "crates/core" }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
] }
open = "5.4.1"
ratatui = "0.30.0"
rspotify = { version = "0.16.1", default-features = false, features = [
  "client-reqwest",
  "reqwest-rustls-tls",
] }
librespot = { version = "0.8.0", default-features = false, features = [
  "rustls-tls-native-roots",
  "rodio-backend",
] }

chrono = { version = "0.4", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls",
  "query",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "net",
  "io-util",
  "signal",
] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
